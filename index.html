<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware | Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --main: #0d1b2a; --gold: #b99121; }
        body { background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .admin-hidden { display: none; }
    </style>
</head>
<body>

    <header class="bg-[#0d1b2a] text-white p-6 text-center shadow-lg">
        <h1 class="text-3xl font-bold tracking-widest text-[#b99121]">MACRO HARDWARE</h1>
        <p class="text-sm opacity-80">Premium Building Materials</p>
    </header>

    <div id="adminPanel" class="admin-hidden bg-gray-200 p-6 border-b-2 border-gray-400">
        <h2 class="text-xl font-bold mb-4 text-center">Admin Store Manager</h2>
        <div class="max-w-md mx-auto space-y-3">
            <input type="text" id="pName" placeholder="Product Name (e.g. Rafter)" class="w-full p-2 rounded border">
            <input type="text" id="pPrice" placeholder="Price (e.g. R 179)" class="w-full p-2 rounded border">
            <input type="file" id="pImage" class="w-full p-2 text-sm">
            <button onclick="addProduct()" class="w-full bg-[#0d1b2a] text-white py-2 rounded font-bold hover:bg-black transition">Add to Shop</button>
            <p class="text-xs text-red-600 text-center">*یہ حصہ صرف آپ کو نظر آ رہا ہے*</p>
        </div>
    </div>

    <div class="container mx-auto p-6">
        <div id="productList" class="grid grid-cols-1 md:grid-cols-3 gap-8">
            </div>
    </div>

    <script>
        // Admin Panel Toggle (Type 'admin' anywhere to show)
        let keys = "";
        window.addEventListener("keydown", (e) => {
            keys += e.key;
            if (keys.includes("admin")) {
                document.getElementById("adminPanel").classList.toggle("admin-hidden");
                keys = "";
            }
        });

        // Load Stock from LocalStorage
        window.onload = function() {
            const savedData = localStorage.getItem('macroStock');
            if (savedData) {
                document.getElementById('productList').innerHTML = savedData;
            }
        };

        // Add Product Function
        function addProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const imageInput = document.getElementById('pImage');
            
            if (!name || !price || !imageInput.files[0]) {
                alert("براہ کرم تمام معلومات پُر کریں");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const productCard = `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden border border-gray-200 group">
                        <img src="${e.target.result}" class="w-full h-56 object-cover">
                        <div class="p-4 text-center">
                            <h3 class="text-xl font-bold text-gray-800">${name}</h3>
                            <p class="text-[#b91c1c] font-black text-2xl my-2">${price}</p>
                            <a href="https://wa.me/27844548665?text=I want to order ${name}" 
                               class="inline-block bg-[#22c55e] text-white px-6 py-2 rounded-full font-bold hover:bg-green-600 transition">
                               Order on WhatsApp
                            </a>
                            <button onclick="this.parentElement.parentElement.remove(); save();" class="block mx-auto mt-4 text-xs text-gray-400 hover:text-red-500 underline admin-btn hidden">Remove Item</button>
                        </div>
                    </div>`;
                
                document.getElementById('productList').innerHTML += productCard;
                save();
                // Clear inputs
                document.getElementById('pName').value = "";
                document.getElementById('pPrice').value = "";
            };
            reader.readAsDataURL(imageInput.files[0]);
        }

        function save() {
            const list = document.getElementById('productList').innerHTML;
            localStorage.setItem('macroStock', list);
        }
    </script>
</body>
</html>
