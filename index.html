<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware - Catalog</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f4f4f9; margin: 0; padding: 10px; text-align: center; }
        header { background: #1a1a1a; color: #ffcc00; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-bottom: 4px solid #cc0000; }
        
        /* Search Box */
        .search-container { position: sticky; top: 0; background: #f4f4f9; padding: 10px 0; z-index: 100; }
        #searchInput { width: 90%; padding: 12px; border-radius: 25px; border: 2px solid #1a1a1a; font-size: 16px; outline: none; }

        /* Product Cards */
        .product-list { display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 10px; }
        .card { background: white; width: 95%; max-width: 400px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #ddd; }
        
        /* Product Image */
        .card img { width: 100%; height: 200px; object-fit: cover; background-color: #eee; }
        
        .info { padding: 15px; text-align: left; }
        .info h3 { margin: 0; font-size: 18px; color: #333; }
        .price { color: #d32f2f; font-size: 22px; font-weight: bold; display: block; margin-top: 8px; }

        /* QR Code Footer */
        .qr-section { margin-top: 40px; padding: 20px; background: white; border: 2px dashed #1a1a1a; border-radius: 15px; }
        .qr-image { width: 180px; height: 180px; }
    </style>
</head>
<body>

<header>
    <h1>MACRO HARDWARE</h1>
    <p>Premium Building Materials & Tools</p>
</header>

<div class="search-container">
    <input type="text" id="searchInput" onkeyup="searchItems()" placeholder="Search product (e.g. Paint, Aluminium)...">
</div>

<div class="product-list" id="productList">
    
    <div class="card">
        <img src="https://via.placeholder.com/400x200?text=Aluminium+Window" alt="Product">
        <div class="info">
            <h3>Aluminium Window</h3>
            <span class="price">R 1,500</span>
        </div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/400x200?text=Roof+Paint" alt="Product">
        <div class="info">
            <h3>Roof Paint (5 Liters)</h3>
            <span class="price">R 450</span>
        </div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/400x200?text=Tools" alt="Product">
        <div class="info">
            <h3>Steel Nails (1 Pack)</h3>
            <span class="price">R 75</span>
        </div>
    </div>

</div>

<div class="qr-section">
    <h3 style="color: #1a1a1a;">SCAN TO VISIT MACRO HARDWARE</h3>
    <img class="qr-image" src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://macro-hardware.com" alt="QR Code">
    <p style="font-size: 12px; color: #666; margin-top: 10px;">Take a screenshot of this QR Code</p>
</div>

<script>
    function searchItems() {
        let input = document.getElementById('searchInput').value.toLowerCase();
        let cards = document.getElementsByClassName('card');
        
        for (let i = 0; i < cards.length; i++) {
            let title = cards[i].getElementsByTagName('h3')[0].innerText.toLowerCase();
            if (title.includes(input)) {
                cards[i].style.display = "block";
            } else {
                cards[i].style.display = "none";
            }
        }
    }
</script>

</body>
</html>
