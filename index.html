<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware | Admin Store</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --main: #0d1b2a; --gold: #e09f3e; --bg: #f1f5f9; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; }
        header { background: var(--main); color: var(--white); padding: 40px 20px; text-align: center; border-bottom: 6px solid var(--gold); }
        header h1 { margin: 0; color: var(--gold); text-transform: uppercase; }
        
        .admin-panel { background: #cbd5e1; padding: 20px; margin: 20px auto; max-width: 600px; border-radius: 15px; border: 2px solid var(--main); text-align: center; }
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-top: 15px; }
        input[type="text"], input[type="file"] { padding: 12px; border-radius: 8px; border: 1px solid #999; }
        .btn-add { background: #1e293b; color: white; padding: 15px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .card { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.1); text-align: center; }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .info { padding: 15px; }
        .price { color: #b91c1c; font-size: 1.5em; font-weight: bold; display: block; margin: 10px 0; }
        .btn-wa { background: #22c55e; color: white; text-decoration: none; padding: 10px 20px; border-radius: 25px; display: inline-block; }
        
        #qrcode-container { margin: 40px auto; text-align: center; background: white; padding: 20px; width: fit-content; border-radius: 10px; }
        footer { background: var(--main); color: white; padding: 20px; text-align: center; margin-top: 40px; }
    </style>
</head>
<body>

<header>
    <h1>MACRO HARDWARE</h1>
</header>

<div class="admin-panel">
    <h3>Add New Stock</h3>
    <div class="input-group">
        <input type="text" id="pName" placeholder="Product Name (e.g. Rafter)">
        <input type="text" id="pPrice" placeholder="Price (e.g. R 179)">
        <input type="file" id="pImgFile" accept="image/*">
        <button class="btn-add" onclick="addProduct()">Add to Shop</button>
    </div>
</div>

<div class="container">
    <div id="productGrid" class="grid"></div>

    <div id="qrcode-container">
        <h4>Scan to Visit Store</h4>
        <div id="qrcode"></div>
    </div>
</div>

<footer>
    <p>© 2026 Macro Hardware | 084 454 8665</p>
</footer>

<script>
    function addProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const fileInput = document.getElementById('pImgFile');
        const file = fileInput.files[0];

        if(!name || !price || !file) {
            alert("Please fill all fields and select a photo!");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const imgUrl = e.target.result;
            const grid = document.getElementById('productGrid');
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${imgUrl}" alt="${name}">
                <div class="info">
                    <h3>${name}</h3>
                    <span class="price">${price}</span>
                    <a href="https://wa.me/27844548665?text=Hi, I want to order ${name}" class="btn-wa">Order on WhatsApp</a>
                    <br><br>
                    <button onclick="this.parentElement.parentElement.remove()" style="background:#ef4444; color:white; border:none; padding:5px 10px; border-radius:5px; cursor:pointer;">Remove</button>
                </div>
            `;
            grid.appendChild(card);
        }
        reader.readAsDataURL(file);

        // Reset inputs
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        fileInput.value = '';
    }

    new QRCode(document.getElementById("qrcode"), {
        text: window.location.href,
        width: 120,
        height: 120
    });
</script>

</body>
</html>
