<div class="max-w-md mx-auto mt-6 px-4">
    <div class="relative">
        <input type="text" id="searchInput" onkeyup="searchStock()" placeholder="Search by product name..." 
        class="w-full p-3 pl-10 border border-blue-300 rounded-xl shadow-sm focus:ring-2 focus:ring-blue-500 outline-none">
        <span class="absolute left-3 top-3.5 text-gray-400">🔍</span>
    </div>
</div>

<div class="max-w-md mx-auto mt-6 bg-white rounded-xl shadow-lg overflow-hidden">
    <table class="w-full text-left border-collapse">
        <thead class="bg-blue-600 text-white">
            <tr>
                <th class="p-3 text-sm font-semibold uppercase">Product</th>
                <th class="p-3 text-sm font-semibold uppercase">Stock</th>
                <th class="p-3 text-sm font-semibold uppercase">Price</th>
                <th class="p-3 text-sm font-semibold uppercase">Action</th>
            </tr>
        </thead>
        <tbody id="stockTableBody">
            </tbody>
    </table>
</div>
