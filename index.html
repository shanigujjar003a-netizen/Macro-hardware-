<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware - Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Urdu&display=swap');
        body { font-family: 'Noto Urdu', sans-serif; direction: rtl; }
    </style>
</head>
<body class="bg-gray-100">

    <nav class="bg-blue-700 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Macro Hardware</h1>
            <button onclick="toggleAdmin()" class="bg-blue-500 px-3 py-1 rounded text-sm">ایڈمن لاگ ان</button>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        
        <div id="adminPanel" class="hidden bg-white p-6 rounded-lg shadow-md mb-8 border-2 border-blue-200">
            <h2 class="text-xl font-bold mb-4 text-blue-700">نئی پوسٹ لگائیں</h2>
            <div class="grid gap-4">
                <input type="text" id="itemName" placeholder="چیز کا نام" class="border p-2 rounded">
                <input type="text" id="itemPrice" placeholder="قیمت (Rs.)" class="border p-2 rounded">
                <input type="text" id="itemImg" placeholder="تصویر کا لنک (URL)" class="border p-2 rounded">
                <button onclick="addItem()" class="bg-green-600 text-white py-2 rounded font-bold">پوسٹ کریں</button>
            </div>
        </div>

        <h2 class="text-2xl font-bold mb-6 border-b-2 border-blue-700 pb-2">آج کی نئی مصنوعات</h2>
        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <img src="https://images.unsplash.com/photo-1581244276891-83393a676fb7?w=500" class="h-48 w-full object-cover">
                <div class="p-4 text-right">
                    <h3 class="text-xl font-bold text-gray-800">الیکٹرک ڈرل مشین</h3>
                    <p class="text-blue-600 font-bold mt-2">Rs. 5,500</p>
                    <button class="mt-4 w-full bg-green-500 text-white py-2 rounded-lg flex items-center justify-center gap-2">
                        <span>واٹس ایپ پر آرڈر دیں</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        }

        function addItem() {
            const name = document.getElementById('itemName').value;
            const price = document.getElementById('itemPrice').value;
            const img = document.getElementById('itemImg').value;

            if(name && price) {
                const grid = document.getElementById('productGrid');
                const newItem = `
                    <div class="bg-white rounded-lg shadow-md overflow-hidden border-t-4 border-blue-500">
                        <img src="${img || 'https://via.placeholder.com/300'}" class="h-48 w-full object-cover">
                        <div class="p-4 text-right">
                            <h3 class="text-xl font-bold text-gray-800">${name}</h3>
                            <p class="text-blue-600 font-bold mt-2">Rs. ${price}</p>
                            <button class="mt-4 w-full bg-green-500 text-white py-2 rounded-lg">واٹس ایپ پر آرڈر دیں</button>
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('afterbegin', newItem);
                alert("پوسٹ لگ گئی ہے!");
                toggleAdmin();
            }
        }
    </script>
</body>
</html>
