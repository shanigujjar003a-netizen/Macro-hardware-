<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware - Admin Panel</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #status { margin-top: 15px; font-size: 14px; color: blue; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Stock Management</h2>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price">
        <input type="file" id="pImage">
        <button onclick="uploadItem()">Add to Stock</button>
        <p id="status"></p>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCkVQ5Rvkbt1SRyUlyIJN1SRyUlyIJN1",
            authDomain: "macro-hardware.firebaseapp.com",
            projectId: "macro-hardware",
            storageBucket: "macro-hardware.appspot.com",
            messagingSenderId: "696737618825",
            appId: "1:696737618825:web:4bbb63f3d2ddc0bfa35f58", // آپ کی نئی آئی ڈی یہاں ڈال دی ہے
            measurementId: "G-GDQ93GZCJX"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        async function uploadItem() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const imageFile = document.getElementById('pImage').files[0];
            const status = document.getElementById('status');
            if (!name || !price || !imageFile) { alert("Fill all fields!"); return; }
            status.innerText = "Uploading... Please wait";
            try {
                const imgRef = storage.ref('products/' + imageFile.name);
                await imgRef.put(imageFile);
                const imgUrl = await imgRef.getDownloadURL();
                await db.collection('hardware_items').add({ name, price, image: imgUrl, date: new Date() });
                status.style.color = "green";
                status.innerText = "Success! Added to stock.";
                document.getElementById('pName').value = ""; document.getElementById('pPrice').value = "";
            } catch (e) { 
                status.style.color = "red";
                status.innerText = "Error: " + e.message; 
            }
        }
    </script>
</body>
</html>
