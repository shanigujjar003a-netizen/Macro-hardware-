
<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware Admin</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; }
        .navbar { background-color: #1a4db1; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
        .admin-btn { background-color: #3b82f6; border: none; color: white; padding: 8px 16px; border-radius: 4px; cursor: pointer; }
        .container { display: flex; justify-content: center; margin-top: 50px; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; font-size: 22px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        
        /* گیلری کے لیے خاص بٹن */
        .file-input-label {
            display: block;
            background: #f9f9f9;
            padding: 12px;
            border: 1px dashed #bbb;
            text-align: center;
            cursor: pointer;
            color: #666;
            margin: 10px 0;
            border-radius: 5px;
        }
        #preview { width: 100%; max-height: 150px; object-fit: contain; margin-top: 10px; display: none; border-radius: 5px; }
        
        .save-btn { width: 100%; background-color: #28a745; color: white; border: none; padding: 12px; font-size: 18px; font-weight: bold; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<script>
    // 1. پروڈکٹ کو براؤزر کی میموری میں محفوظ کرنے کا فنکشن
    function saveProduct() {
        const name = document.getElementById('productName').value; // جہاں نام لکھتے ہیں اس کی ID
        const price = document.getElementById('productPrice').value; // جہاں قیمت لکھتے ہیں اس کی ID

        if (name && price) {
            let products = JSON.parse(localStorage.getItem('myProducts')) || [];
            products.push({ name: name, price: price });
            
            localStorage.setItem('myProducts', JSON.stringify(products));
            alert("پروڈکٹ محفوظ ہوگئی ہے!");
            displayProducts(); // لسٹ اپڈیٹ کرنے کے لیے
        } else {
            alert("براہ کرم نام اور قیمت دونوں لکھیں");
        }
    }

    // 2. محفوظ شدہ پروڈکٹس کو سکرین پر دکھانے کا فنکشن
    function displayProducts() {
        const productList = document.getElementById('displayArea'); // جہاں لسٹ نظر آنی ہے
        let products = JSON.parse(localStorage.getItem('myProducts')) || [];
        
        productList.innerHTML = ''; // پرانی لسٹ صاف کریں
        
        products.forEach((item, index) => {
            productList.innerHTML += `<li>${item.name} - ${item.price} روپے</li>`;
        });
    }

    // 3. جب پیج ریفریش ہو تو خود بخود ڈیٹا لوڈ ہو جائے
    window.onload = displayProducts;
</script>

    <body>

    <div class="navbar">
        <div style="font-weight: bold; font-size: 20px;">Macro Hardware</div>
        <button class="admin-btn">Admin Panel</button>
    </div>

    <div class="container">
        <div class="card">
            <h2>Add New Product</h2>
            <input type="text" placeholder="Product Name">
            <input type="text" placeholder="Price (Rs.)">
            
            <label class="file-input-label" for="pPhoto">
                📷 Select Photo from Gallery
            </label>
            <input type="file" id="pPhoto" accept="image/*" style="display: none;" onchange="showPreview(event)">
            
            <img id="preview" src="">

            <button class="save-btn">Save Product</button>
        </div>
    </div>

    <script>
        function showPreview(event) {
            if(event.target.files.length > 0){
                var src = URL.createObjectURL(event.target.files[0]);
                var preview = document.getElementById("preview");
                preview.src = src;
                preview.style.display = "block";
            }
        }
    </script>

</body>
</html>
