<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 pb-20">
    <nav class="bg-blue-800 text-white p-4 shadow-lg flex justify-between items-center">
        <h1 class="text-xl font-bold">Macro Hardware</h1>
        <button onclick="toggleAdmin()" class="bg-blue-600 px-4 py-2 rounded shadow">Admin Panel</button>
    </nav>

    <div class="container mx-auto p-4">
        <div id="adminPanel" class="hidden bg-white p-6 shadow-md rounded-lg mb-6 border-t-4 border-blue-800">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Add New Product</h2>
            <div class="space-y-3">
                <input type="text" id="pName" placeholder="Product Name" class="w-full border p-2 rounded">
                <input type="number" id="pPrice" placeholder="Price (Rs.)" class="w-full border p-2 rounded">
                <input type="text" id="pImg" placeholder="Image Link (Paste URL here)" class="w-full border p-2 rounded">
                <button onclick="saveProduct()" class="w-full bg-green-600 text-white p-2 rounded font-bold hover:bg-green-700">Save Product</button>
            </div>
        </div>

        <div id="product-list" class="grid grid-cols-2 md:grid-cols-4 gap-4">
            </div>
    </div>

    <script>
        // Data saving logic
        let products = JSON.parse(localStorage.getItem('macroStoreData')) || [];

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        }

        function saveProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImg').value || 'https://via.placeholder.com/150';

            if(name && price) {
                products.push({ name, price, img });
                localStorage.setItem('macroStoreData', JSON.stringify(products));
                renderProducts();
                
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pImg').value = '';
                toggleAdmin();
            } else {
                alert("Please enter Name and Price");
            }
        }

        function renderProducts() {
            const list = document.getElementById('product-list');
            list.innerHTML = products.map((p, index) => `
                <div class="bg-white p-3 shadow rounded-lg border hover:shadow-lg transition">
                    <img src="${p.img}" class="w-full h-32 object-cover rounded mb-2" onerror="this.src='https://via.placeholder.com/150'">
                    <h3 class="font-bold text-gray-800">${p.name}</h3>
                    <p class="text-blue-700 font-bold">Rs. ${p.price}</p>
                    <button onclick="deleteProduct(${index})" class="text-red-500 text-xs mt-2 underline">Remove</button>
                </div>
            `).join('');
        }

        function deleteProduct(index) {
            if(confirm("Do you want to remove this item?")) {
                products.splice(index, 1);
                localStorage.setItem('macroStoreData', JSON.stringify(products));
                renderProducts();
            }
        }

        renderProducts();
    </script>
</body>
</html>
