
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware - Catalog</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; text-align: center; }
        header { background: #1a1a1a; color: #ffcc00; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .product-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; }
        .card { background: white; width: 300px; border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); padding: 15px; }
        .card img { width: 100%; border-radius: 10px; height: 150px; object-fit: cover; }
        .info h3 { margin: 10px 0; color: #333; }
        .price { color: #d9534f; font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

<header>
    <h1>MACRO HARDWARE</h1>
    <p>Premium Building Materials & Tools</p>
</header>

<div class="product-list">
    <div class="card">
        <img src="https://via.placeholder.com/400x200" alt="Aluminium Window">
        <div class="info">
            <h3>Aluminium Window</h3>
            <span class="price">R 1600</span>
        </div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/400x200" alt="Roof Paint">
        <div class="info">
            <h3>Roof Paint (5 Liters)</h3>
            <span class="price">R 450</span>
        </div>
    </div>

    <div class="card">
        <img src="https://via.placeholder.com/400x200" alt="Steel Nails">
        <div class="info">
            <h3>Steel Nails (1 Pack)</h3>
            <span class="price">R 75</span>
        </div>
    </div>
</div>

</body>
</html>
