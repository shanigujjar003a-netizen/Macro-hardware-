<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware - Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 pb-20">

    <nav class="bg-blue-800 text-white p-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold text-white">Macro Hardware</h1>
            <button onclick="toggleAdmin()" class="bg-blue-600 px-4 py-2 rounded hover:bg-blue-700 transition">Admin Panel</button>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <div id="adminPanel" class="hidden bg-white p-6 shadow-md rounded-lg mb-6 border-t-4 border-blue-800">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Add New Product</h2>
            <div class="space-y-3">
                <input type="text" id="pName" placeholder="Product Name (e.g. Aluminum Window)" class="w-full border p-2 rounded">
                <input type="number" id="pPrice" placeholder="Price" class="w-full border p-2 rounded">
                <input type="text" id="pImg" placeholder="Image URL" class="w-full border p-2 rounded">
                <button onclick="addProduct()" class="w-full bg-green-600 text-white p-2 rounded font-bold hover:bg-green-700">Save Product</button>
            </div>
        </div>

        <div id="product-list" class="grid grid-cols-1 md:grid-cols-3 gap-6">
            </div>
    </div>

    <script>
        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        }

        function addProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImg').value || 'https://via.placeholder.com/150';
            const list = document.getElementById('product-list');
            
            if(name && price) {
                const card = `
                <div class="bg-white p-4 shadow rounded-lg overflow-hidden border hover:shadow-xl transition">
                    <img src="${img}" class="w-full h-40 object-cover mb-4">
                    <h3 class="font-bold text-lg text-gray-800">${name}</h3>
                    <p class="text-blue-700 font-bold mt-2">Rs. ${price}</p>
                    <button class="mt-4 w-full bg-blue-800 text-white py-1 rounded">View Details</button>
                </div>`;
                
                list.innerHTML += card;
                
                // Clear inputs and hide panel
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pImg').value = '';
                toggleAdmin();
            } else {
                alert("Please enter Name and Price");
            }
        }
    </script>
</body>
</html>
