
<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hardware Admin Panel</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
        }
        /* نیلے رنگ کا اوپر والا حصہ */
        .navbar {
            background-color: #1a4db1;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-btn {
            background-color: #3b82f6;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        /* فارم کا ڈیزائن */
        .container {
            display: flex;
            justify-content: center;
            margin-top: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 400px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            font-size: 22px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 16px;
        }
        input::placeholder {
            color: #ccc;
        }
        /* سبز بٹن */
        .save-btn {
            width: 100%;
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }
        .save-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div style="font-weight: bold; font-size: 20px;">Macro Hardware</div>
        <button class="admin-btn">Admin Panel</button>
    </div>

    <div class="container">
        <div class="card">
            <h2>Add New Product</h2>
            <input type="text" id="pName" placeholder="Product Name">
            <input type="text" id="pPrice" placeholder="Price (Rs.)">
            <input type="text" id="pImage" placeholder="Image Link (Paste URL here)">
            
            <button class="save-btn" onclick="saveData()">Save Product</button>
        </div>
    </div>

    <script>
        function saveData() {
            let name = document.getElementById('pName').value;
            let price = document.getElementById('pPrice').value;
            let img = document.getElementById('pImage').value;

            if(name && price && img) {
                alert("پروڈکٹ محفوظ کر لی گئی ہے!\nنام: " + name);
                // یہاں آپ ڈیٹا بیس کا کوڈ لگا سکتے ہیں
            } else {
                alert("براہ کرم تمام خانے پُر کریں۔");
            }
        }
    </script>

</body>
</html>
