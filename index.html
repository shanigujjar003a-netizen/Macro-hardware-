
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware - Inventory System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body class="bg-gray-50 font-sans">

    <nav class="bg-slate-900 text-white p-6 shadow-2xl border-b-4 border-blue-500 text-center">
        <h1 class="text-3xl font-extrabold tracking-tighter">MACRO HARDWARE STOCK MANAGEMENT</h1>
    </nav>

    <div class="container mx-auto p-6 max-w-6xl">
        
        <div class="bg-white p-8 rounded-2xl shadow-xl mb-10 border border-gray-200">
            <h2 class="text-xl font-bold mb-6 text-slate-800 border-b pb-2">Inventory Control Panel</h2>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                    <input id="itemName" type="text" placeholder="e.g. Alpine Cement 42.5" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Stock Quantity</label>
                    <input id="itemQty" type="number" placeholder="0" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Price (R)</label>
                    <input id="itemPrice" type="text" placeholder="0.00" class="w-full p-3 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-end">
                    <button onclick="saveStock()" class="w-full bg-blue-600 text-white font-bold py-3 rounded-xl hover:bg-blue-700 transform active:scale-95 transition shadow-lg">
                        Update Inventory
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-2xl overflow-hidden border border-gray-200">
            <table class="w-full text-left">
                <thead class="bg-slate-100 text-slate-600 uppercase text-sm">
                    <tr>
                        <th class="p-5">Product Details</th>
                        <th class="p-5">Stock Level</th>
                        <th class="p-5">Unit Price</th>
                        <th class="p-5 text-right">Management</th>
                    </tr>
                </thead>
                <tbody id="inventoryList" class="divide-y divide-gray-100">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- IMPORTANT: REPLACE WITH YOUR FIREBASE SETTINGS ---
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "YOUR_DATABASE_URL",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Function to Save/Update Data
        function saveStock() {
            const name = document.getElementById('itemName').value;
            const qty = document.getElementById('itemQty').value;
            const price = document.getElementById('itemPrice').value;

            if(name === "" || qty === "" || price === "") {
                alert("Error: Please complete all fields.");
                return;
            }

            db.ref('macro_stock/' + name).set({
                quantity: qty,
                price: price
            }).then(() => {
                // Clear inputs after success
                document.getElementById('itemName').value = "";
                document.getElementById('itemQty').value = "";
                document.getElementById('itemPrice').value = "";
            });
        }
