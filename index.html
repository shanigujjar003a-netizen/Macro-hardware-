<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware - Admin Panel</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-storage.js"></script>

    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .container { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #1c1e21; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin: 12px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background-color: #007bff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 15px; }
        button:hover { background-color: #0056b3; }
        #status { margin-top: 20px; font-size: 14px; font-weight: 500; }
    </style>
</head>
<body>

<div class="container">
    <h2>Stock Management</h2>
    <input type="text" id="pName" placeholder="Product Name (e.g. Steel Door)">
    <input type="number" id="pPrice" placeholder="Price (PKR)">
    <input type="file" id="pImage">
    <button onclick="uploadItem()">Add to Stock</button>
    <p id="status"></p>
</div>

<script>
    // حسنین، آپ کا اصلی فائر بیس کوڈ یہاں سیٹ کر دیا گیا ہے
    const firebaseConfig = {
        apiKey: "AIzaSyCkVQ5Rvkbt1SRyUlyIJN1SRyUlyIJN1",
        authDomain: "macro-hardware.firebaseapp.com",
        projectId: "macro-hardware",
        storageBucket: "macro-hardware.appspot.com",
        messagingSenderId: "696737618825",
        appId: "1:696737618825:web:4bbb63f3c4bbb63f3c",
        measurementId: "G-GDQ93GZCJX"
    };

    // Firebase کو شروع کریں
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const storage = firebase.storage();

    async function uploadItem() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const imageFile = document.getElementById('pImage').files[0];
        const status = document.getElementById('status');

        if (!name || !price || !imageFile) {
            alert("براہ کرم تمام معلومات پُر کریں اور تصویر منتخب کریں!");
            return;
        }

        status.style.color = "blue";
        status.innerText = "اپ لوڈ ہو رہا ہے... براہ کرم انتظار کریں۔";
        
        try {
            // 1. تصویر کو اسٹوریج میں اپ لوڈ کریں
            const imgRef = storage.ref('products/' + imageFile.name);
            await imgRef.put(imageFile);
            const imgUrl = await imgRef.getDownloadURL();

            // 2. ڈیٹا کو فائر اسٹور میں محفوظ کریں
            await db.collection('hardware_items').add({
                name: name,
                price: price,
                image: imgUrl,
                timestamp: firebase.firestore.FieldValue.serverTimestamp()
            });

            status.style.color = "green";
            status.innerText = "مبارک ہو! سامان کامیابی سے اسٹاک میں شامل ہو گیا۔";
            
            // خانوں کو خالی کر دیں
            document.getElementById('pName').value = "";
            document.getElementById('pPrice').value = "";
            document.getElementById('pImage').value = "";
        } catch (error) {
            status.style.color = "red";
            status.innerText = "خرابی: " + error.message;
            console.error(error);
        }
    }
</script>

</body>
</html>
