<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware - Online Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Urdu&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Urdu', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 pb-20">

    <nav class="bg-blue-800 text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Macro Hardware</h1>
            <button onclick="toggleAdmin()" class="bg-blue-600 px-3 py-1 rounded text-sm">ایڈمن لاگ ان</button>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        
        <div id="adminPanel" class="hidden bg-white p-6 rounded-lg shadow-md mb-8 border-2 border-blue-200">
            <h2 class="text-xl font-bold mb-4 text-blue-800 text-center">نئی پوسٹ لگائیں</h2>
            <div class="space-y-3">
                <input type="text" id="pName" placeholder="چیز کا نام" class="w-full p-2 border rounded">
                <input type="number" id="pPrice" placeholder="قیمت (Rs.)" class="w-full p-2 border rounded">
                <input type="text" id="pImg" placeholder="تصویر کا لنک (URL)" class="w-full p-2 border rounded">
                <button onclick="addProduct()" class="w-full bg-green-600 text-white py-2 rounded font-bold hover:bg-green-700">پوسٹ کریں</button>
            </div>
        </div>

        <h2 class="text-2xl font-bold mb-6 border-b-2 border-blue-800 pb-2 text-gray-800">ہمارا اسٹاک</h2>
        
        <div id="productGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <script>
        // آپ کا اسٹاک ڈیٹا
        let products = [
            { name: "ایلومینیم ونڈو (سلور)", price: "12500", img: "https://images.unsplash.com/photo-1510074377623-8cf13fb86c08?auto=format&fit=crop&q=80&w=400" },
            { name: "باتھ روم ایلومینیم ونڈو", price: "4500", img: "https://images.unsplash.com/photo-1584622650111-993a426fbf0a?auto=format&fit=crop&q=80&w=400" },
            { name: "روف پینٹ (واٹر پروف) 16L", price: "8800", img: "https://images.unsplash.com/photo-1589939705384-5185137a7f0f?auto=format&fit=crop&q=80&w=400" },
            { name: "الیکٹرک ڈرل مشین", price: "5500", img: "https://images.unsplash.com/photo-1504148455328-c376907d081c?auto=format&fit=crop&q=80&w=400" },
            { name: "لوہے کا رافٹر (فی فٹ)", price: "450", img: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&q=80&w=400" },
            { name: "ہارڈویئر ٹول کٹ", price: "3200", img: "https://images.unsplash.com/photo-1581244277943-fe4a9c777189?auto=format&fit=crop&q=80&w=400" }
        ];

        function displayProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';
            products.forEach((p, index) => {
                grid.innerHTML += `
                    <div class="bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl transition-shadow duration-300">
                        <img src="${p.img}" class="w-full h-48 object-cover" alt="${p.name}">
                        <div class="p-4 text-center">
                            <h3 class="text-lg font-bold text-gray-800">${p.name}</h3>
                            <p class="text-blue-700 font-bold text-xl my-2">Rs. ${p.price}</p>
                            <a href="https://wa.me/923001234567?text=مجھے اس چیز کا آرڈر دینا ہے: ${p.name}" class="inline-block w-full bg-green-500 text-white py-2 rounded-lg font-bold hover:bg-green-600 transition-colors">واٹس ایپ پر آرڈر دیں</a>
                        </div>
                    </div>
                `;
            });
        }

        function toggleAdmin() {
            let pass = prompt("ایڈمن پاس ورڈ درج کریں:");
            if(pass === "1234") {
                document.getElementById('adminPanel').classList.toggle('hidden');
            } else {
                alert("غلط پاس ورڈ!");
            }
        }

        function addProduct() {
            const name = document.getElementById('pName').value;
            const price = document.getElementById('pPrice').value;
            const img = document.getElementById('pImg').value || 'https://via.placeholder.com/400';

            if(name && price) {
                products.unshift({ name, price, img });
                displayProducts();
                document.getElementById('pName').value = '';
                document.getElementById('pPrice').value = '';
                document.getElementById('pImg').value = '';
                alert("سامان ایڈ کر دیا گیا ہے!");
            } else {
                alert("برائے مہربانی نام اور قیمت لکھیں");
            }
        }

        // پہلی بار لوڈ ہونے پر سامان دکھائیں
        displayProducts();
    </script>
</body>
</html>
