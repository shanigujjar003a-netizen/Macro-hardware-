<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macro Hardware | Admin & Store</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --main: #0d1b2a; --gold: #e09f3e; --bg: #f1f5f9; --white: #ffffff; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: var(--bg); margin: 0; color: #333; }
        header { background: var(--main); color: var(--white); padding: 50px 20px; text-align: center; border-bottom: 8px solid var(--gold); }
        header h1 { margin: 0; font-size: 2.5em; text-transform: uppercase; color: var(--gold); }
        
        .admin-panel { background: #e2e8f0; padding: 20px; margin: 20px auto; max-width: 800px; border-radius: 10px; border: 2px dashed var(--main); }
        .admin-panel h2 { margin-top: 0; color: var(--main); }
        .input-group { margin-bottom: 15px; }
        input, button { padding: 10px; border-radius: 5px; border: 1px solid #ccc; margin-right: 5px; }
        .btn-add { background: var(--main); color: white; cursor: pointer; border: none; font-weight: bold; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .card { background: var(--white); border-radius: 20px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; position: relative; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-bottom: 4px solid var(--gold); }
        .info { padding: 20px; }
        .price { color: #c1121f; font-size: 1.5em; font-weight: bold; display: block; margin: 10px 0; }
        .btn-wa { background: #25d366; color: white; text-decoration: none; padding: 12px 20px; border-radius: 50px; display: inline-block; }
        
        #qrcode-container { text-align: center; margin: 40px 0; background: white; padding: 20px; display: inline-block; border-radius: 10px; }
        footer { background: var(--main); color: var(--white); padding: 40px 20px; text-align: center; }
    </style>
</head>
<body>

<header>
    <h1>MACRO HARDWARE</h1>
    <p>Premium Building Materials & Solutions</p>
</header>

<div class="admin-panel">
    <h2>Admin Center (Stock Manager)</h2>
    <div class="input-group">
        <input type="text" id="pName" placeholder="Product Name">
        <input type="text" id="pPrice" placeholder="Price (e.g. R 500)">
        <input type="text" id="pImg" placeholder="Image Link (URL)">
        <button class="btn-add" onclick="addProduct()">Add to Shop</button>
    </div>
    <p style="font-size: 0.8em;">*Note: Use an image hosting link (like PostImages or ImgBB) for the photo.</p>
</div>

<div class="container">
    <div id="productGrid" class="grid">
        </div>

    <div style="text-align: center;">
        <div id="qrcode-container">
            <h3>Your Shop QR Code</h3>
            <div id="qrcode"></div>
            <p>Scan to visit store</p>
        </div>
    </div>
</div>

<footer>
    <p>📍 10 Manchester Road | 📞 084 454 8665</p>
    <p>© 2026 Macro Hardware</p>
</footer>

<script>
    // Function to Add Product
    function addProduct() {
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;
        const img = document.getElementById('pImg').value || 'https://via.placeholder.com/300';

        if(name == '' || price == '') { alert('Please enter name and price'); return; }

        const grid = document.getElementById('productGrid');
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <img src="${img}" alt="${name}">
            <div class="info">
                <h3>${name}</h3>
                <span class="price">${price}</span>
                <a href="https://wa.me/27844548665?text=Hi, I want to order ${name}" class="btn-wa">Order on WhatsApp</a>
                <br><br>
                <button onclick="this.parentElement.parentElement.remove()" style="background:red; color:white; border:none; border-radius:5px; cursor:pointer;">Delete</button>
            </div>
        `;
        grid.appendChild(card);
        
        // Clear inputs
        document.getElementById('pName').value = '';
        document.getElementById('pPrice').value = '';
        document.getElementById('pImg').value = '';
    }

    // Generate QR Code for Current Page URL
    new QRCode(document.getElementById("qrcode"), {
        text: window.location.href,
        width: 150,
        height: 150
    });
</script>

</body>
</html>
